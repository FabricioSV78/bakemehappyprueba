<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#17366D" />
    <title>Abriendo WhatsApp | Bake Me Happy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #17366d;
        background: #fff4ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background:
          radial-gradient(circle at 15% 15%, rgba(228, 154, 175, 0.3), transparent 32%),
          radial-gradient(circle at 85% 80%, rgba(170, 179, 229, 0.32), transparent 35%),
          linear-gradient(135deg, #fff4ed 0%, #fffaf7 52%, #eff0fc 100%);
      }

      main {
        width: min(100%, 31rem);
        padding: clamp(2rem, 7vw, 3rem);
        text-align: center;
        border: 1px solid rgba(228, 154, 175, 0.4);
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 1.5rem 4rem rgba(23, 54, 109, 0.14);
        backdrop-filter: blur(14px);
      }

      .logo {
        width: 4.75rem;
        height: 4.75rem;
        object-fit: contain;
        border-radius: 1.25rem;
        box-shadow: 0 0.75rem 1.75rem rgba(23, 54, 109, 0.12);
      }

      h1 {
        margin: 1.35rem 0 0;
        font-size: clamp(1.8rem, 7vw, 2.45rem);
        line-height: 1.08;
      }

      p {
        margin: 0.9rem auto 0;
        max-width: 28rem;
        color: rgba(23, 54, 109, 0.72);
        line-height: 1.65;
      }

      .loader {
        width: 2.25rem;
        height: 2.25rem;
        margin: 1.5rem auto 0;
        border: 0.25rem solid rgba(118, 84, 149, 0.18);
        border-top-color: #765495;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        margin-top: 1.5rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.3rem;
        border-radius: 999px;
        background: #17366d;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 0.25rem solid rgba(118, 84, 149, 0.3);
        outline-offset: 0.2rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader {
          animation: none;
          border-top-color: rgba(118, 84, 149, 0.18);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="/images/webp/LOGO/logo-principal-header.webp"
        alt="Bake Me Happy"
        width="76"
        height="76"
      />
      <h1>Abriendo WhatsApp…</h1>
      <p id="status" aria-live="polite">
        Estamos preparando tu conversación con Bake Me Happy.
      </p>
      <div class="loader" aria-hidden="true"></div>
      <a id="continue-link" href="#" hidden>Continuar a WhatsApp</a>
    </main>

    <script>
      (() => {
        const status = document.getElementById("status");
        const continueLink = document.getElementById("continue-link");

        try {
          const encodedTarget = window.location.hash.slice(1);
          const target = decodeURIComponent(encodedTarget);
          const targetUrl = new URL(target);
          const validTarget =
            targetUrl.protocol === "https:" && targetUrl.hostname === "wa.me";

          if (!validTarget) throw new Error("Destino no permitido");

          continueLink.href = targetUrl.href;
          continueLink.hidden = false;

          window.addEventListener(
            "load",
            () => {
              window.setTimeout(() => window.location.replace(targetUrl.href), 0);
            },
            { once: true },
          );
        } catch {
          document.querySelector(".loader")?.remove();
          status.textContent =
            "No pudimos abrir WhatsApp automáticamente. Vuelve a la tienda e inténtalo nuevamente.";
          continueLink.href = "/tienda";
          continueLink.textContent = "Volver a la tienda";
          continueLink.hidden = false;
        }
      })();
    </script>
  </body>
</html>
